name: Frontend Tests

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional reason for manual run'
        required: false
        default: 'manual trigger'
  push:
    branches: ["main", "develop", "release/*"]
    paths:
      - 'app/**'
      - '.github/workflows/frontend.yml'
  # No base-branch filter: stacked PRs target feature branches and must run too.
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/frontend.yml'

permissions: read-all

jobs:
  frontend:
    runs-on: ubuntu-24.04
    # Browsers and their system libraries come preinstalled; the tag must match the
    # locked @playwright/test version (checked below). https://playwright.dev/docs/ci#via-containers
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001 --ipc=host --init
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Check Playwright image matches @playwright/test
        working-directory: app
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          grep -qF "image: mcr.microsoft.com/playwright:v${version}-noble" ../.github/workflows/frontend.yml || {
            echo "::error file=.github/workflows/frontend.yml::Bump the container image to mcr.microsoft.com/playwright:v${version}-noble to match @playwright/test ${version}"
            exit 1
          }

      - name: Lint
        working-directory: app
        run: npm run lint --silent

      - name: Type check
        working-directory: app
        run: npm run tsc

      - name: Run unit tests
        working-directory: app
        run: npm run test

      - name: Run e2e tests
        working-directory: app
        env:
          VITE_API_URL: http://localhost:3000
          STRICT_MOBILE: 1
        run: npx playwright test -c src/__tests__/playwright.config.ts

      - name: Upload HTML report (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore

      - name: Upload Traces (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: app/test-results
          if-no-files-found: ignore
