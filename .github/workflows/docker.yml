name: Docker build

on:
  pull_request:
    branches: ["main", "develop", "release/*"]

permissions: read-all

jobs:
  # Builds every production image and scans it for known vulnerabilities.
  # The scans are report-only: new CVEs are published daily, so a blocking
  # image scan would fail PRs that changed nothing. Dependency bumps are
  # handled in their own PRs instead.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Docker version
        run: docker --version

      - name: Build API image
        run: |
          IMAGE=dnsapi
          make build_api_image IMAGE=${IMAGE}
          echo "DNS_API_IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Run Trivy vulnerability scanner - DNS API
        id: trivy_api
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DNS_API_IMAGE }}
          trivy-config: ./.github/trivy.yaml
          version: v0.74.0

      - name: Build Proxy image
        run: |
          IMAGE=dnsproxy
          make build_proxy_image IMAGE=${IMAGE}
          echo "DNS_PROXY_IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Run Trivy vulnerability scanner - DNS Proxy
        id: trivy_proxy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DNS_PROXY_IMAGE }}
          trivy-config: ./.github/trivy.yaml
          version: v0.74.0

      - name: Build Frontend image
        run: |
          IMAGE=dnswebapp
          make build_frontend_image IMAGE=${IMAGE}
          echo "DNS_FRONTEND_IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Run Trivy vulnerability scanner - DNS Frontend
        id: trivy_frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DNS_FRONTEND_IMAGE }}
          trivy-config: ./.github/trivy.yaml
          version: v0.74.0

      - name: Build DNS blocklists image
        run: |
          IMAGE=dnsblocklists
          make build_blocklists_image IMAGE=${IMAGE}
          echo "DNS_BLOCKLISTS_IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Run Trivy vulnerability scanner - DNS blocklists
        id: trivy_blocklists
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DNS_BLOCKLISTS_IMAGE }}
          trivy-config: ./.github/trivy.yaml
          version: v0.74.0

      - name: Build DNS check image
        run: |
          IMAGE=dnscheck
          make build_dnscheck_image IMAGE=${IMAGE}
          echo "DNS_CHECK_IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Run Trivy vulnerability scanner - DNS check
        id: trivy_dnscheck
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DNS_CHECK_IMAGE }}
          trivy-config: ./.github/trivy.yaml
          version: v0.74.0

      - name: Trivy scan summary
        if: >-
          steps.trivy_api.outcome == 'failure' ||
          steps.trivy_proxy.outcome == 'failure' ||
          steps.trivy_frontend.outcome == 'failure' ||
          steps.trivy_blocklists.outcome == 'failure' ||
          steps.trivy_dnscheck.outcome == 'failure'
        env:
          API: ${{ steps.trivy_api.outcome }}
          PROXY: ${{ steps.trivy_proxy.outcome }}
          FRONTEND: ${{ steps.trivy_frontend.outcome }}
          BLOCKLISTS: ${{ steps.trivy_blocklists.outcome }}
          DNSCHECK: ${{ steps.trivy_dnscheck.outcome }}
        run: |
          {
            echo "## :warning: Trivy vulnerability scan findings"
            echo ""
            echo "The following images have fixable HIGH/CRITICAL vulnerabilities:"
            echo ""
            [ "$API" = "failure" ] && echo "- **DNS API** (dnsapi)"
            [ "$PROXY" = "failure" ] && echo "- **DNS Proxy** (dnsproxy)"
            [ "$FRONTEND" = "failure" ] && echo "- **DNS Frontend** (dnswebapp)"
            [ "$BLOCKLISTS" = "failure" ] && echo "- **DNS Blocklists** (dnsblocklists)"
            [ "$DNSCHECK" = "failure" ] && echo "- **DNS Check** (dnscheck)"
            echo ""
            echo "This check does not block the PR. Review the Trivy scan steps above and upgrade the affected dependencies in a separate PR."
          } >> "$GITHUB_STEP_SUMMARY"

  # Blocking: Trivy misconfiguration scan of each service's Dockerfile.
  # Its result only changes when a Dockerfile changes, so it is safe to gate on.
  trivy-config:
    name: trivy config (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - proxy
          - blocklists
          - dnscheck
          - app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Run Trivy misconfiguration scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.service }}
          trivy-config: ./.github/trivy.yaml
          version: v0.74.0

  # Blocking: Dockerfile lint. Like the config scan, it only changes when a
  # Dockerfile changes.
  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The .dev Dockerfiles are local-only dev images (see Makefile dev_*
        # targets); they are never built by this workflow or by
        # ansible/build-and-push-images.yml, so they are excluded here.
        dockerfile:
          - api/Dockerfile
          - proxy/Dockerfile
          - blocklists/Dockerfile
          - dnscheck/Dockerfile
          - app/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
