name: Secret scan

# gitleaks over the commits each event adds: pull requests scan base..head,
# pushes to develop/main scan before..after. History older than that was
# scanned once when the gate was introduced; it is immutable and public, so
# it is not re-scanned. Allowlisted false positives live in .gitleaks.toml.
#
# Run the same scan locally from the repo root (git mode reads only committed
# content, so untracked local config files are not reported):
#
#   docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo \
#     ghcr.io/gitleaks/gitleaks:v8.30.1 git . --redact --verbose \
#     --config .gitleaks.toml --log-opts="origin/develop..HEAD"
#
# For a git worktree, also mount the main repository's .git directory at its
# own absolute path so the worktree's gitdir link resolves inside the
# container. Use `dir .` instead of `git .` to scan the working tree; that
# mode also reads untracked and ignored files.

on:
  push:
    branches: ["develop", "main"]
  # No paths filter: the scan must run on every PR so it can be a required
  # check without skipped-status gaps.
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt. Update both together.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the PR range and the push scan both walk commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base_url}/${tarball}"
          curl -sSfLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check -
          tar -xzf "${tarball}" gitleaks

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./gitleaks git . --redact --verbose --no-banner \
            --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A newly created branch reports an all-zero "before" sha; scan the
          # working tree then, since there is no range to compare against.
          if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            ./gitleaks dir . --redact --verbose --no-banner \
              --config .gitleaks.toml
          else
            ./gitleaks git . --redact --verbose --no-banner \
              --config .gitleaks.toml \
              --log-opts="${BEFORE_SHA}..${GITHUB_SHA}"
          fi
