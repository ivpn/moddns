# Dependabot version updates: weekly grouped PRs per ecosystem entry.
#
# Version updates run as soon as this file is on the default branch (develop).
# Security updates (PRs for open Dependabot alerts) are a separate repository
# setting; once it is on, the groups below marked `applies-to:
# security-updates` bundle those PRs per entry instead of one PR per alert.
#
# Dependabot labels its PRs "dependencies" (plus the ecosystem label) and
# creates those labels on first use.
#
# Grouping: minor/patch bumps go into one weekly PR per entry, across all of
# its directories; major bumps are left out of the group so they still arrive
# individually and get reviewed on their own. Go modules split this further;
# see their entry.
#
# Go modules are vendored with `go mod vendor` in CI (see go.yml), not
# committed to git, so a gomod PR needs no extra manual vendoring step.
# api/, proxy/, blocklists/ and dnscheck/ all
# `replace github.com/ivpn/dns/libs => ../libs`, so the Go modules share one
# multi-directory entry (see below) and go.yml re-runs the full Go suite on a
# libs/ change.

version: 2

updates:
  # --- GitHub Actions ---------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-deps:
        applies-to: security-updates
        patterns: ["*"]

  # --- Docker base images -------------------------------------------------
  # One entry covering every production Dockerfile; `directories:` (plural)
  # accepts an explicit list of paths, not just globs.
  - package-ecosystem: "docker"
    directories:
      - "/api"
      - "/proxy"
      - "/blocklists"
      - "/dnscheck"
      - "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
      docker-deps:
        applies-to: security-updates
        patterns: ["*"]

  # --- Go modules ----------------------------------------------------------
  # One entry for all five modules, so a grouped PR bumps a shared dependency
  # in libs/ and in every consumer at once. Consumers build libs/ through a
  # local `replace`, and their go.mod must require at least the versions libs/
  # requires (module graph pruning, Go 1.17+); a libs/-only bump would leave
  # them inconsistent and `go mod vendor` fails with "go mod tidy" needed.
  #
  # Version updates cover direct dependencies only (the default); indirect
  # ones move with the direct dependency that requires them. Version-update
  # groups (keep the go-core patterns in sync in all three):
  # - go-core: DNS stack and MongoDB driver, one PR per dependency (patch
  #   included), so each gets its own proxy benchmarks or migration review.
  #   Dependabot evaluates `group-by` groups after plain ones, so go-patch and
  #   go-minor exclude the go-core patterns explicitly.
  # - go-patch: every other patch bump, one weekly PR.
  # - go-minor: every other minor bump, one PR per dependency. For v0 modules
  #   Dependabot counts 0.x -> 0.y as minor, and those often break the API.
  # `cooldown` waits a week before proposing a new release; security updates
  # are not delayed.
  #
  # Security-update groups: the DNS stack (as in go-core), the MongoDB driver
  # and Fiber each get their own PR across every module using them; everything
  # else shares go-deps. Security groups ignore `group-by`, so go-deps excludes
  # the others by pattern (keep the two lists in sync).
  # Security updates also bump vulnerable indirect dependencies: `allow`
  # dependency-type is not applied to them, and no group rule can tell direct
  # from indirect.
  - package-ecosystem: "gomod"
    directories:
      - "/libs"
      - "/api"
      - "/proxy"
      - "/blocklists"
      - "/dnscheck"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-adguard:
        applies-to: security-updates
        patterns: ["github.com/AdguardTeam/*"]
      go-miekg-dns:
        applies-to: security-updates
        patterns: ["github.com/miekg/dns"]
      go-quic:
        applies-to: security-updates
        patterns: ["github.com/quic-go/*"]
      go-mongo:
        applies-to: security-updates
        patterns: ["go.mongodb.org/mongo-driver*"]
      go-fiber:
        applies-to: security-updates
        patterns: ["github.com/gofiber/fiber*"]
      go-deps:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns:
          - "github.com/AdguardTeam/*"
          - "github.com/miekg/dns"
          - "github.com/quic-go/*"
          - "go.mongodb.org/mongo-driver*"
          - "github.com/gofiber/fiber*"
      go-core:
        patterns:
          - "github.com/AdguardTeam/*"
          - "github.com/miekg/dns"
          - "github.com/quic-go/*"
          - "go.mongodb.org/mongo-driver*"
        update-types: ["minor", "patch"]
        group-by: dependency-name
      go-patch:
        update-types: ["patch"]
        exclude-patterns:
          - "github.com/AdguardTeam/*"
          - "github.com/miekg/dns"
          - "github.com/quic-go/*"
          - "go.mongodb.org/mongo-driver*"
      go-minor:
        update-types: ["minor"]
        group-by: dependency-name
        exclude-patterns:
          - "github.com/AdguardTeam/*"
          - "github.com/miekg/dns"
          - "github.com/quic-go/*"
          - "go.mongodb.org/mongo-driver*"

  # --- Frontend (npm) ------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-deps:
        applies-to: security-updates
        patterns: ["*"]

  # --- E2E test tooling (pip) ----------------------------------------------
  # Test-only dependencies, never shipped in an image, but they carry most of
  # the open Dependabot alerts, so they get the same weekly grouped PRs.
  - package-ecosystem: "pip"
    directories:
      - "/tests"
      - "/tests/moddns_client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
      pip-deps:
        applies-to: security-updates
        patterns: ["*"]
