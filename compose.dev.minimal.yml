# Minimal development stack, layered by `make up_dev` unless FULL=1 is set.
# Services moved to the "full" profile are not started; the Go services talk
# to the single Redis master directly (an empty CACHE_MASTER_NAME disables the
# sentinel client in libs/cache).
services:
  redis_replica:
    profiles: ["full"]

  redis_replica_dns:
    profiles: ["full"]

  redis_sentinel:
    profiles: ["full"]

  recursor_sdns:
    profiles: ["full"]

  redisinsight:
    profiles: ["full"]

  dnsapi:
    environment:
      CACHE_ADDRESS: redis:6379
      CACHE_MASTER_NAME: ""

  dnsblocklists:
    environment:
      CACHE_ADDRESS: redis:6379
      CACHE_MASTER_NAME: ""

  dnsproxy:
    environment:
      CACHE_ADDRESS: redis:6379
      CACHE_MASTER_NAME: ""
